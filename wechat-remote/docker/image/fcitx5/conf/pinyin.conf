# fcitx5 拼音优化配置
# PageSize: 候选词数量,9 比默认 7 多看两个
PageSize=9
# CloudPinyin: 云拼音,长句准确率大幅提升 (需要网络)
CloudPinyinEnabled=True
CloudPinyinIndex=2
CloudPinyinAnimation=True
KeepCloudPinyinPlaceHolder=False
# Prediction: 联想输入,打完一个词自动推荐下一个
Prediction=True
PredictionSize=49
# Spell / Emoji / 拆字 / CJK Ext B
SpellEnabled=True
EmojiEnabled=True
ChaiziEnabled=True
ExtBEnabled=True
# Preedit
PreeditMode="Composing pinyin"
PreeditCursorPositionAtBeginning=True
PinyinInPreedit=False
# Switch behavior
SwitchInputMethodBehavior="Commit current preedit"
# 句子数量
Number of sentence=2
LongWordLengthLimit=4
# Quick phrase
QuickPhraseKey=semicolon
VAsQuickphrase=True
FirstRun=False

[ForgetWord]
0=Control+7

[PrevPage]
0=minus
1=Up
2=KP_Up

[NextPage]
0=equal
1=Down
2=KP_Down

[PrevCandidate]
0=Shift+Tab

[NextCandidate]
0=Tab

[ChooseCharFromPhrase]
0=bracketleft
1=bracketright

[FilterByStroke]
0=grave

[Fuzzy]
VE_UE=True
NG_GN=True
Inner=True
InnerShort=True
PartialFinal=True
PartialSp=False
V_U=False
AN_ANG=False
EN_ENG=False
IAN_IANG=False
IN_ING=False
U_OU=False
UAN_UANG=False
C_CH=False
F_H=False
L_N=False
S_SH=False
Z_ZH=False
