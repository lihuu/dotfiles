[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-terminal"
version = "0.1.0"
description = "Persistent remote terminal runtime using OpenSSH and tmux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
remote-terminal = "remote_terminal.cli:main"
rt = "remote_terminal.cli:main"

[tool.setuptools]
packages = ["remote_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]